<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Comparing 0.5, 0.45 and 0.405</title>
  <desc id="d">The numbers lined up by place as 0.500, 0.450 and 0.405. Tenths digits are 5, 4 and 4, so 0.5 is greatest. Hundredths digits of the other two are 5 and 0, so 0.45 is greater than 0.405. Two hundredths grids show 50 squares shaded for 0.5 and 45 squares for 0.45.</desc>
  <rect width="600" height="700" rx="24" fill="#ffffff"/>
  <text x="300" y="48" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2937">Line up the places, compare from the left</text>
  <g font-size="17" font-weight="700" fill="#374151" text-anchor="middle"><text x="170" y="94">ones</text><text x="290" y="94">tenths</text><text x="390" y="94">hundredths</text><text x="505" y="94">thousandths</text></g>
  <rect x="250" y="106" width="80" height="188" rx="12" fill="none" stroke="#b45309" stroke-width="4"/>
  <rect x="350" y="168" width="80" height="126" rx="12" fill="none" stroke="#0f766e" stroke-width="4" stroke-dasharray="8 5"/>
  <g font-size="40" font-weight="800" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="170" y="152" fill="#1f2937">0</text><text x="228" y="152" fill="#1f2937">.</text><text x="290" y="152" fill="#b45309">5</text><text x="390" y="152" fill="#1f2937">0</text><text x="505" y="152" fill="#9ca3af">0</text>
    <text x="170" y="214" fill="#1f2937">0</text><text x="228" y="214" fill="#1f2937">.</text><text x="290" y="214" fill="#1f2937">4</text><text x="390" y="214" fill="#0f766e">5</text><text x="505" y="214" fill="#9ca3af">0</text>
    <text x="170" y="276" fill="#1f2937">0</text><text x="228" y="276" fill="#1f2937">.</text><text x="290" y="276" fill="#1f2937">4</text><text x="390" y="276" fill="#0f766e">0</text><text x="505" y="276" fill="#1f2937">5</text>
  </g>
  <g font-size="18" fill="#4b5563"><text x="36" y="148">0.5</text><text x="36" y="210">0.45</text><text x="36" y="272">0.405</text></g>
  <text x="300" y="334" text-anchor="middle" font-size="20" fill="#1f2937">Tenths: 5 is more than 4, so <tspan font-weight="800" fill="#b45309">0.5 is greatest</tspan>.</text>
  <text x="300" y="364" text-anchor="middle" font-size="20" fill="#1f2937">Hundredths: 5 is more than 0, so <tspan font-weight="800" fill="#0f766e">0.45 &gt; 0.405</tspan>.</text>
  <g transform="translate(60 396)">
    <rect width="220" height="220" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <rect width="110" height="220" fill="#fcd34d"/>
    <path d="M22 0V220M44 0V220M66 0V220M88 0V220M110 0V220M132 0V220M154 0V220M176 0V220M198 0V220M0 22H220M0 44H220M0 66H220M0 88H220M0 110H220M0 132H220M0 154H220M0 176H220M0 198H220" stroke="#6b7280" stroke-width="1"/>
    <rect width="220" height="220" fill="none" stroke="#1f2937" stroke-width="2"/>
  </g>
  <g transform="translate(320 396)">
    <rect width="220" height="220" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <rect width="88" height="220" fill="#6ee7b7"/><rect x="88" width="22" height="110" fill="#6ee7b7"/>
    <path d="M22 0V220M44 0V220M66 0V220M88 0V220M110 0V220M132 0V220M154 0V220M176 0V220M198 0V220M0 22H220M0 44H220M0 66H220M0 88H220M0 110H220M0 132H220M0 154H220M0 176H220M0 198H220" stroke="#6b7280" stroke-width="1"/>
    <rect width="220" height="220" fill="none" stroke="#1f2937" stroke-width="2"/>
  </g>
  <text x="170" y="652" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">0.5 = 50 hundredths</text>
  <text x="430" y="652" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">0.45 = 45 hundredths</text>
  <text x="300" y="684" text-anchor="middle" font-size="18" fill="#4b5563">More digits does not mean a bigger number.</text>
</svg>
