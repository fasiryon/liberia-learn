<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiberiaLearn Offline</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        width: 100%;
        max-width: 520px;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #0f766e;
      }
      h1 {
        margin: 12px 0 0;
        font-size: 30px;
        line-height: 1.2;
      }
      p {
        margin: 16px 0 0;
        font-size: 16px;
        line-height: 1.6;
        color: #334155;
      }
      ul {
        margin: 20px 0 0;
        padding-left: 20px;
        color: #1e293b;
      }
      li {
        margin-top: 10px;
        line-height: 1.5;
      }
      button {
        margin-top: 24px;
        min-height: 44px;
        padding: 12px 18px;
        border: 0;
        border-radius: 999px;
        background: #0f766e;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #115e59;
      }
      @media (max-width: 640px) {
        .card {
          padding: 22px;
          border-radius: 20px;
        }
        h1 {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <div class="eyebrow">LiberiaLearn</div>
        <h1>You're offline.</h1>
        <p>Your work has been saved and will sync when you reconnect.</p>
        <ul>
          <li>View previously cached lessons</li>
          <li>Continue reading downloaded pages</li>
        </ul>
        <button type="button" onclick="window.location.reload()">Try again</button>
      </div>
    </div>
  </body>
</html>
