name: Lab review capture

# Manually triggered visual-evidence capture for the Interactive Lab Production Team. It runs the dev-only
# /lab-review harness on a GitHub-hosted runner instead of a developer machine, one profile per job, and fails a
# capture whose actual renderer/profile differs from the requested one (no silent fallback counts as evidence).
# Evidence proves rendering correctness, composition, layout and renderer routing only — never device performance.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or full SHA to capture (empty = the ref this workflow runs from)"
        required: false
        default: ""
      lab:
        description: "Lab id"
        required: true
        default: "mount-coffee-hydropower"
      profiles:
        description: "ALL or a comma list of HIGH,STANDARD,LOW,FALLBACK_2D (one job per profile, run one at a time)"
        required: true
        default: "ALL"
      scenarios:
        description: "ALL or a comma list of review scenario ids"
        required: true
        default: "ALL"
      viewports:
        description: "Comma list of desktop,mobile,landscape (landscape = phone held sideways, A17)"
        required: true
        default: "desktop,mobile"
      still_only:
        description: "Stills only (skip motion strips)"
        type: boolean
        default: true
      batch:
        description: "Optional batch label (kept in the artifact name)"
        required: false
        default: ""
      probe:
        description: "Also record the interaction probe (Tab order, focus styling, touch-target sizes)"
        type: boolean
        default: false
      walkthrough:
        description: "Also run the keyboard-only walkthrough (scripts/labs/interaction-walkthrough.ts) on desktop and mobile"
        type: boolean
        default: false
      reduced_motion:
        description: "Capture with prefers-reduced-motion (adds reduced-motion strips when motion is captured)"
        type: boolean
        default: false
      capture:
        description: "Run the still/motion capture (turn off to run only the acceptance checks below)"
        type: boolean
        default: true
      determinism:
        description: "RX-005 A9: capture the selected scenarios twice with reduced motion and require byte-identical PNGs"
        type: boolean
        default: false
      runtime_acceptance:
        description: "RX-005 A5: 20x remount loop (live renderers, context warnings, renderer.info.memory, heap)"
        type: boolean
        default: false
      abort_three_chunk:
        description: "RX-005 A3: on HIGH, abort the three.js chunk; the lab must land on LOW and every check must complete"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lab-review-capture-${{ inputs.lab }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.plan.outputs.profiles }}
    steps:
      - id: plan
        env:
          PROFILES: ${{ inputs.profiles }}
        run: |
          set -euo pipefail
          if [ "$PROFILES" = "ALL" ]; then
            echo 'profiles=["HIGH","STANDARD","LOW","FALLBACK_2D"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          json="["
          for p in $(echo "$PROFILES" | tr ',' ' '); do
            case "$p" in HIGH|STANDARD|LOW|FALLBACK_2D) ;; *) echo "Unknown profile: $p"; exit 1 ;; esac
            json="$json\"$p\","
          done
          echo "profiles=${json%,}]" >> "$GITHUB_OUTPUT"

  capture:
    needs: plan
    runs-on: ubuntu-latest
    # Full still captures plus determinism, remount and walkthrough acceptance can exceed 90 minutes.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # One profile at a time: no parallel browser/dev-server memory spikes and no interleaved artifacts.
      max-parallel: 1
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.profiles) }}
    env:
      LAB_REVIEW_HARNESS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders only (same as CI): the review harness needs no database, login or provider.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test"
      NEXTAUTH_SECRET: "ci-secret-not-real"
      NEXTAUTH_URL: "http://localhost:3000"
      OPENAI_API_KEY: "sk-test"
      GROQ_API_KEY: "gsk-test"
      RESEND_API_KEY: "re_test"
      EMAIL_FROM: "test@test.com"
      LAB: ${{ inputs.lab }}
      PROFILE: ${{ matrix.profile }}
      SCENARIOS: ${{ inputs.scenarios }}
      VIEWPORTS: ${{ inputs.viewports }}
      STILL_ONLY: ${{ inputs.still_only }}
      BATCH: ${{ inputs.batch }}
      PROBE: ${{ inputs.probe }}
      WALKTHROUGH: ${{ inputs.walkthrough }}
      REDUCED_MOTION: ${{ inputs.reduced_motion }}
      CAPTURE: ${{ inputs.capture }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Record the exact commit captured
        id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start the review dev server
        run: |
          nohup npx next dev -p 3000 > dev-server.log 2>&1 &
          echo $! > dev-server.pid
      - name: Wait for the review harness (bounded)
        run: |
          url="http://localhost:3000/lab-review/${LAB}?profile=${PROFILE}"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 240 "$url" || true)
            if [ "$code" = "200" ]; then echo "Harness ready after attempt $i"; exit 0; fi
            echo "Attempt $i: HTTP $code"; sleep 10
          done
          echo "The review harness never became ready."; tail -n 80 dev-server.log; exit 1
      - name: Capture ${{ matrix.profile }}
        if: ${{ inputs.capture }}
        run: |
          label="ci-${GITHUB_RUN_ID}-${PROFILE}${BATCH:+-$BATCH}"
          args=(--lab "$LAB" --label "$label" --profiles "$PROFILE" --viewports "$VIEWPORTS" --restart-every 6)
          if [ "$SCENARIOS" != "ALL" ]; then args+=(--scenarios "$SCENARIOS"); fi
          if [ "$STILL_ONLY" = "true" ]; then args+=(--still-only); fi
          if [ "$PROBE" = "true" ]; then args+=(--probe); fi
          if [ "$REDUCED_MOTION" = "true" ]; then args+=(--reduced-motion); fi
          timeout 80m npx tsx scripts/labs/capture-lab-review.ts "${args[@]}"
      - name: Determinism ${{ matrix.profile }} (two runs, byte-identical)
        if: ${{ always() && inputs.determinism }}
        run: |
          args=(--lab "$LAB" --profiles "$PROFILE" --viewports "$VIEWPORTS" --restart-every 6 --still-only --reduced-motion)
          if [ "$SCENARIOS" != "ALL" ]; then args+=(--scenarios "$SCENARIOS"); fi
          base="artifacts/lab-review/${LAB}/determinism-${GITHUB_RUN_ID}-${PROFILE}"
          timeout 40m npx tsx scripts/labs/capture-lab-review.ts "${args[@]}" --label det-a --out "$base/a"
          timeout 40m npx tsx scripts/labs/capture-lab-review.ts "${args[@]}" --label det-b --out "$base/b"
          npx tsx scripts/labs/compare-lab-captures.ts "$base/a" "$base/b" --report "$base/compare.json"
      - name: Runtime acceptance ${{ matrix.profile }} (A5 remount loop)
        if: ${{ always() && inputs.runtime_acceptance && (matrix.profile == 'HIGH' || matrix.profile == 'STANDARD' || matrix.profile == 'LOW') }}
        run: timeout 20m npx tsx scripts/labs/runtime-acceptance.ts --lab "$LAB" --profiles "$PROFILE" --out "artifacts/lab-review/${LAB}/runtime-acceptance-${GITHUB_RUN_ID}-${PROFILE}"
      - name: Three chunk aborted (A3), keyboard walkthrough on HIGH
        if: ${{ always() && inputs.abort_three_chunk && matrix.profile == 'HIGH' && hashFiles('scripts/labs/interaction-walkthrough.ts') != '' }}
        run: timeout 25m npx tsx scripts/labs/interaction-walkthrough.ts --lab "$LAB" --profile HIGH --viewport desktop --abort-three-chunk
      - name: Keyboard walkthrough ${{ matrix.profile }}
        if: ${{ always() && inputs.walkthrough && hashFiles('scripts/labs/interaction-walkthrough.ts') != '' }}
        run: |
          status=0
          for viewport in $(echo "$VIEWPORTS" | tr ',' ' '); do
            timeout 20m npx tsx scripts/labs/interaction-walkthrough.ts --lab "$LAB" --profile "$PROFILE" --viewport "$viewport" || status=1
          done
          exit $status
      - name: Stop the dev server
        if: always()
        run: |
          if [ -f dev-server.pid ]; then pkill -P "$(cat dev-server.pid)" || true; kill "$(cat dev-server.pid)" || true; fi
      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-review-${{ inputs.lab }}-${{ matrix.profile }}-${{ steps.sha.outputs.short }}-run${{ github.run_id }}${{ inputs.batch && format('-{0}', inputs.batch) || '' }}
          path: |
            artifacts/lab-review/
            dev-server.log
          if-no-files-found: warn
          retention-days: 30
