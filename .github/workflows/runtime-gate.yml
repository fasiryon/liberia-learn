name: Runtime Gate 1

on:
  push:
    branches: [ main, "sprint*", "feature*" ]
  pull_request:
    branches: [ main ]

jobs:
  runtime-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run npm test
        run: npm test

      - name: Run Vitest (full runtime gate)
        run: npx vitest run

      - name: Upload Audit Reports (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: docs/audits/
