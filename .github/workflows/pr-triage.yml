name: PR Triage

on:
  schedule:
    - cron: "0 13 * * *" # daily
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: PR Triage
        uses: actions/github-script@v7
        with:
          script: |
            const staleDays = 14;
            const now = new Date();

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const managedLabels = [
              'stale',
              'failing-checks',
              'needs-rebase',
              'likely-unrelated',
              'manual-review',
              'ready-for-review',
              'likely-superseded'
            ];

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description
                });
              }
            }

            await Promise.all([
              ensureLabel('stale', 'D4C5F9', 'PR is stale'),
              ensureLabel('failing-checks', 'B60205', 'PR has failing checks'),
              ensureLabel('needs-rebase', 'FBCA04', 'PR needs rebase'),
              ensureLabel('likely-unrelated', '5319E7', 'PR looks unrelated'),
              ensureLabel('manual-review', '0E8A16', 'Needs manual review'),
              ensureLabel('ready-for-review', '1D76DB', 'Healthy PR'),
              ensureLabel('likely-superseded', 'C2E0C6', 'Likely already covered by main')
            ]);

            function daysBetween(a, b) {
              return Math.floor((a - b) / (1000 * 60 * 60 * 24));
            }

            function titleFlags(title) {
              const t = title.toLowerCase();
              const flags = [];

              if (/demo nursing|nursing pill|wrong project/.test(t)) {
                flags.push('likely-unrelated');
              }

              if (/terraform|infra|prisma|schema|auth|security|cve|deploy|ci/.test(t)) {
                flags.push('manual-review');
              }

              return flags;
            }

            async function getFiles(pr) {
              const res = await github.rest.pulls.listFiles({
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              });
              return res.data.map(f => f.filename);
            }

            async function getRecentMainFiles() {
              const commits = await github.rest.repos.listCommits({
                owner,
                repo,
                sha: 'main',
                per_page: 10
              });

              const files = new Set();

              for (const commit of commits.data) {
                const c = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: commit.sha
                });

                (c.data.files || []).forEach(f => files.add(f.filename));
              }

              return files;
            }

            const recentMainFiles = await getRecentMainFiles();

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            for (const pr of prs) {
              const ageDays = daysBetween(now, new Date(pr.updated_at));
              const flags = new Set(titleFlags(pr.title));

              const files = await getFiles(pr);

              let overlap = 0;
              for (const f of files) {
                if (recentMainFiles.has(f)) overlap++;
              }

              const overlapRatio = files.length ? overlap / files.length : 0;

              if (overlapRatio > 0.6 && ageDays > 7) {
                flags.add('likely-superseded');
              }

              if (ageDays >= staleDays) flags.add('stale');

              const mergeState = (pr.mergeable_state || '').toUpperCase();
              if (['DIRTY', 'BLOCKED', 'BEHIND'].includes(mergeState)) {
                flags.add('needs-rebase');
              }

              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha
              });

              const failing = (checks.data.check_runs || [])
                .filter(c => c.conclusion && !['success','neutral','skipped'].includes(c.conclusion)).length;

              if (failing > 0) flags.add('failing-checks');

              if (!pr.draft && failing === 0 && mergeState === 'CLEAN' && !flags.has('likely-unrelated')) {
                flags.add('ready-for-review');
              }

              const labels = Array.from(flags);

              await github.rest.issues.setLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels
              });

              const comment = `
<!-- pr-triage-comment -->
### 🤖 PR Triage

- Age: ${ageDays} days
- Files changed: ${files.length}
- Overlap with recent main: ${(overlapRatio*100).toFixed(0)}%
- Merge state: ${mergeState}
- Failing checks: ${failing}

Labels:
${labels.join(', ') || 'none'}

⚠️ "likely-superseded" means main probably already changed the same files.
              `;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: comment
              });
            }