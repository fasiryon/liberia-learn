name: Temporary read-only evaluation database target audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-targets:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/github-eval-db-target-audit-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test diagnostic safety boundaries without secrets
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_audit_eval_db_targets.py'
      - name: Identify targets and check only previously unverified ledgers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python3 -B .github/scripts/audit_eval_db_targets.py
