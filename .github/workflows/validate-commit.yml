name: Validate commit

# Manually dispatched full validation of one exact commit on a GitHub-hosted runner, for repair and integration
# heads too large to type-check or build on a developer machine. It runs the same gates as CI against the
# selected SHA (not a branch tip), with synthetic credentials only: no secrets, no database migrations, no
# deployment. A run is evidence for exactly the SHA it prints; it never certifies any other commit.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA to validate (must already be reachable on GitHub)"
        required: true
      browser:
        description: "Also run the CI browser checks (PWA E2E and Student Today fixtures)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-commit-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test"
      NEXTAUTH_SECRET: "ci-secret-not-real"
      NEXTAUTH_URL: "http://localhost:3000"
      OPENAI_API_KEY: "sk-test"
      GROQ_API_KEY: "gsk-test"
      RESEND_API_KEY: "re_test"
      EMAIL_FROM: "test@test.com"
      TARGET_SHA: ${{ inputs.sha }}
    steps:
      - name: Require a full commit SHA
        run: |
          set -euo pipefail
          if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          # Route-policy and provenance checks compare against pinned historical commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the exact commit under validation
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$TARGET_SHA" ]; then
            echo "Checked out $actual, expected $TARGET_SHA"
            exit 1
          fi
          {
            echo "### Validated commit"
            echo ""
            echo "\`$actual\` — $(git log -1 --format=%s)"
            echo ""
            echo "Runner: $(nproc) CPU, $(free -g | awk '/^Mem:/{print $2}') GiB RAM; Node $(node --version)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guard _gold artifacts
        run: |
          if git ls-files | grep -E '(^|/)_gold/'; then
            echo "_gold artifacts must never be committed."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Enforce explicit API route auth and scope policy
        run: npm run audit:api-routes
      - run: npx tsc --noEmit
      - run: npx vitest run --reporter=dot
      - name: Run OS vault context security tests
        if: hashFiles('os-vault/daemon/package.json') != ''
        run: npm --prefix os-vault/daemon test
      - run: npm run build
      - name: Confirm the renderer chunk record against the Next build (RX-005 A8)
        if: hashFiles('scripts/labs/check-next-renderer-chunk.ts') != ''
        run: npx tsx scripts/labs/check-next-renderer-chunk.ts
      - name: Install Chromium for PWA E2E
        if: inputs.browser
        run: npx playwright install --with-deps chromium
      - name: Run real-browser PWA E2E
        if: inputs.browser
        run: npm run test:e2e:pwa
      - name: Validate Student Today V2 browser fixtures
        if: inputs.browser
        run: node e2e/product-design-v2/run.mjs
