name: Deploy ECS Images

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  push-web-image:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: liberialearn-web
    steps:
      - uses: actions/checkout@v4
      - id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build image
        run: docker build -t $ECR_REPOSITORY:${GITHUB_SHA} -t $ECR_REPOSITORY:latest .
      - name: Tag image
        run: |
          docker tag $ECR_REPOSITORY:${GITHUB_SHA} ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA}
          docker tag $ECR_REPOSITORY:latest ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest
      - name: Push image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA}
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest
