services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    volumes:
      - ./.env.local:/app/.env.local:ro
    ports:
      - "3000:3000"
    depends_on:
      - worker

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env.local
    volumes:
      - ./.env.local:/app/.env.local:ro
